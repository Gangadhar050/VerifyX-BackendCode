spring.application.name=verify-x1
server.port=8083

# =========================
# Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/verifyx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================
# File Upload
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# Google Gemini AI
# =========================
spring.ai.google.genai.api-key=your_google_API_Key
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# =========================
# JWT
# =========================
app.jwt.secret=MyVeryStrongSecretKey123456789012345678901234567890
app.jwt.expiration-ms=86400000

# =========================
# CORS
# =========================
app.cors.allowed-origins=http://localhost:3000

# =========================
# Mail Configuration
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=vivekmprivate1908@gmail.com
spring.mail.password=Vivek@190845

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.from=vivekmvivekm1908@gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================
# Error
# =========================
server.error.include-message=always
server.error.include-stacktrace=always

# =========================
# Application
# =========================
app.name=VerifyX
app.frontend.url=http://localhost:3000