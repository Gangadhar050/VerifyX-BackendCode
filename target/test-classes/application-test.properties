# Test Database Configuration - H2 In-Memory
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=false

# AI Configuration (placeholder for tests)
spring.ai.google.genai.api-key=test-key

# JWT Configuration (test values)
app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
app.jwt.expiration-ms=3600000

# CORS Configuration (test values)
app.cors.allowed-origins=http://localhost:3000

# Email Configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=3025

# Application Configuration
app.name=VerifyX-Test
app.frontend.url=http://localhost:3000
