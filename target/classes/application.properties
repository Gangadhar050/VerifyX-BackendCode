spring.application.name=verify-x1
#server.port=${SERVER_PORT:8081}
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# FIX: JWT secret was previously generated randomly in code on every restart
# (see JwtService fix). Must be a fixed base64-encoded 256-bit+ secret from env.
# Generate one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# FIX: no CORS origins were configured at all (see SecurityConfig fix).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Don't leak stack traces / internal details in error responses in prod.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Email Configuration (Module 13: Email Notifications)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM:noreply@verifyx.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
app.name=VerifyX
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
